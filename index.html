<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hoje tem beijinho?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #fff0f5, transparent 40%),
                linear-gradient(135deg, #ffe4ec, #fff8fb);
            overflow: hidden;
        }

        /* CARD PRINCIPAL */
        .container {
            width: min(100%, 600px);
            padding: clamp(28px, 6vw, 50px) clamp(18px, 5vw, 30px);
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: clamp(20px, 5vw, 30px);
            box-shadow: 0 20px 60px rgba(180, 70, 110, 0.18);
            backdrop-filter: blur(10px);
        }

        /* INTERROGAÇÃO */
        .emoji {
            font-size: clamp(52px, 15vw, 75px);
            margin-bottom: clamp(12px, 3vw, 20px);
            animation: flutuar 2s ease-in-out infinite;
            line-height: 1;
        }

        /* TÍTULO */
        h1 {
            color: #c2185b;
            font-size: clamp(30px, 8vw, 58px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        /* TEXTO */
        .container p {
            color: #777;
            font-size: clamp(15px, 3.8vw, 18px);
            line-height: 1.5;
            margin-bottom: clamp(24px, 6vw, 35px);
        }

        /* BOTÕES */
        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            min-height: 60px;
            position: relative;
        }

        button {
            border: none;
            padding: 14px clamp(22px, 6vw, 35px);
            border-radius: 50px;
            font-size: clamp(15px, 4vw, 18px);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            white-space: nowrap;
        }

        /* BOTÃO SIM */
        #sim {
            color: white;
            background: #e91e63;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
        }

        #sim:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(233, 30, 99, 0.4);
        }

        /* BOTÃO NÃO */
        #nao {
            color: #555;
            background: #eeeeee;
            position: relative;
        }

        /* TELA DE SUCESSO */
        .sucesso {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #ff80ab, #e91e63);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            z-index: 10;
        }

        .sucesso.ativo {
            opacity: 1;
            visibility: visible;
        }

        /* MENSAGEM */
        .mensagem {
            width: min(100%, 700px);
            text-align: center;
            color: white;
            padding: 20px;
            animation: aparecer 0.7s ease;
        }

        /* CORAÇÃO */
        .mensagem .coracao {
            font-size: clamp(75px, 25vw, 170px);
            display: block;
            margin-bottom: 10px;
            line-height: 1;
            animation: coracao 0.8s ease-in-out infinite alternate;
        }

        /* UAU */
        .mensagem h2 {
            font-size: clamp(38px, 10vw, 70px);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .mensagem p {
            color: white;
            font-size: clamp(17px, 5vw, 22px);
            line-height: 1.4;
            margin: 0;
        }

        /* CONFETES */
        .confete {
            position: fixed;
            top: -30px;
            font-size: clamp(15px, 5vw, 25px);
            pointer-events: none;
            animation: cair linear forwards;
            z-index: 20;
        }

        /* ANIMAÇÕES */
        @keyframes flutuar {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes aparecer {
            from {
                transform: scale(0.5);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes coracao {
            from {
                transform: scale(0.8) rotate(-5deg);
            }

            to {
                transform: scale(1.15) rotate(5deg);
            }
        }

        @keyframes cair {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* TABLET */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 560px;
            }

            .botoes {
                gap: 12px;
            }
        }

        /* CELULAR */
        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .container {
                width: 100%;
                padding: 30px 18px;
            }

            .botoes {
                width: 100%;
                gap: 10px;
            }

            button {
                min-height: 50px;
                padding: 12px 22px;
            }

            .sucesso {
                padding: 12px;
            }

            .mensagem {
                padding: 10px;
            }
        }

        /* CELULARES MUITO PEQUENOS */
        @media (max-width: 360px) {
            .container {
                padding: 24px 14px;
            }

            h1 {
                font-size: 28px;
            }

            .botoes {
                flex-direction: column;
            }

            #sim {
                width: min(100%, 220px);
            }

            #nao {
                width: min(100%, 220px);
            }
        }

        /* TELAS BAIXAS / CELULAR DEITADO */
        @media (max-height: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .emoji {
                font-size: 48px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: clamp(28px, 7vw, 44px);
            }

            .container p {
                margin-bottom: 18px;
            }

            .mensagem .coracao {
                font-size: 70px;
            }
        }

        /* EVITA ANIMAÇÕES EXCESSIVAS QUANDO O USUÁRIO PREFERE REDUÇÃO */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- CARD PRINCIPAL -->

    <main class="container">

        <!-- Antes de clicar: INTERROGAÇÃO -->

        <div class="emoji">
            ❓
        </div>

        <h1>
            Hoje tem beijinho?
        </h1>

        <p>
            Escolha com sabedoria...
        </p>

        <div class="botoes">

            <button id="sim">
                SIM 💖
            </button>

            <button id="nao">
                NÃO 😭
            </button>

        </div>

    </main>


    <!-- TELA DE SUCESSO -->

    <section class="sucesso" id="sucesso">

        <div class="mensagem">

            <!-- Depois do clique: CORAÇÃO -->

            <span class="coracao">
                ❤️
            </span>

            <h2>
                UAU! 🎉
            </h2>

            <p>
                Hoje tem beijinho! 💕
            </p>

        </div>

    </section>


    <script>

        const botaoNao =
            document.getElementById("nao");

        const botaoSim =
            document.getElementById("sim");

        const sucesso =
            document.getElementById("sucesso");


        /*
        ========================================
        BOTÃO NÃO FOGE
        ========================================
        */

        function fugir() {
            const margem = 12;

            const larguraBotao = botaoNao.offsetWidth;
            const alturaBotao = botaoNao.offsetHeight;

            const larguraDisponivel =
                Math.max(margem * 2, window.innerWidth - larguraBotao - margem * 2);

            const alturaDisponivel =
                Math.max(margem * 2, window.innerHeight - alturaBotao - margem * 2);

            const x =
                margem +
                Math.random() * (larguraDisponivel - margem);

            const y =
                margem +
                Math.random() * (alturaDisponivel - margem);

            botaoNao.style.position = "fixed";
            botaoNao.style.left = `${Math.max(margem, Math.min(x, window.innerWidth - larguraBotao - margem))}px`;
            botaoNao.style.top = `${Math.max(margem, Math.min(y, window.innerHeight - alturaBotao - margem))}px`;
            botaoNao.style.zIndex = "30";
        }


        /*
        ========================================
        COMPUTADOR
        Foge quando o mouse chega
        ========================================
        */

        botaoNao.addEventListener(
            "mouseenter",
            fugir
        );


        /*
        ========================================
        CELULAR
        Foge quando tentam tocar
        ========================================
        */

        botaoNao.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                fugir();
            }
        );


        /*
        ========================================
        CASO CONSIGA CLICAR
        ========================================
        */

        botaoNao.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                fugir();
            }
        );


        window.addEventListener("resize", function () {
            if (botaoNao.style.position === "fixed") {
                const rect = botaoNao.getBoundingClientRect();
                const margem = 12;

                const maxX = Math.max(margem, window.innerWidth - rect.width - margem);
                const maxY = Math.max(margem, window.innerHeight - rect.height - margem);

                botaoNao.style.left = `${Math.min(rect.left, maxX)}px`;
                botaoNao.style.top = `${Math.min(rect.top, maxY)}px`;
            }
        });


        /*
        ========================================
        BOTÃO SIM
        ========================================
        */

        botaoSim.addEventListener(
            "click",
            function () {

                /*
                Mostra a tela de felicidade
                */

                sucesso.classList.add(
                    "ativo"
                );


                /*
                Cria os confetes
                */

                criarConfetes();
            }
        );


        /*
        ========================================
        CHUVA DE CONFETES
        ========================================
        */

        function criarConfetes() {

            const simbolos = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💝",
                "✨",
                "🎉",
                "🥰"

            ];


            for (
                let i = 0;
                i < 80;
                i++
            ) {

                const confete =
                    document.createElement(
                        "div"
                    );


                confete.classList.add(
                    "confete"
                );


                confete.textContent =
                    simbolos[
                    Math.floor(
                        Math.random() *
                        simbolos.length
                    )
                    ];


                confete.style.left =
                    Math.random() *
                    100 +
                    "vw";


                confete.style.animationDuration =
                    (
                        2 +
                        Math.random() * 4
                    ) +
                    "s";


                confete.style.animationDelay =
                    Math.random() *
                    1.5 +
                    "s";


                confete.style.fontSize =
                    (
                        15 +
                        Math.random() * 25
                    ) +
                    "px";


                document.body.appendChild(
                    confete
                );


                /*
                Remove depois da animação
                */

                setTimeout(
                    () => {
                        confete.remove();
                    },
                    7000
                );
            }
        }

    </script>

</body>

</html>
